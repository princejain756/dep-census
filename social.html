<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 1280px; height: 640px; background: #0b0e14; font-family: "SF Mono", Menlo, monospace; display: flex; flex-direction: column; justify-content: center; padding: 0 90px; box-sizing: border-box; }
  .name { color: #79c0ff; font-size: 34px; letter-spacing: 2px; }

  .sub { color: #7d8590; font-size: 30px; }
  .bar { position: absolute; bottom: 60px; left: 90px; right: 90px; display: flex; justify-content: space-between; color: #484f58; font-size: 24px; }
</style>
</head>
<body>
  <div class="name">$ npx dep-census</div>
  <div class="headline">your app runs code written<br>by <em>710 strangers</em></div>
  <div class="sub">count the strangers inside node_modules</div>
  <div class="bar"><span>dep-census</span><span>github.com/princejain756/dep-census</span></div>
</body>
</html>
